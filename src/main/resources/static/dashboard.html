<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Smart Expense Tracker Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4 py-3">
    <a class="navbar-brand" href="#">Smart Expense Tracker</a>
    <a href="categories.html" class="btn btn-secondary">Manage Categories</a>
    <div class="d-flex align-items-center ms-auto gap-3">
      <span class="text-white">Welcome, <strong id="username">User</strong>!</span>
      <button id="logoutBtn" class="btn btn-outline-light">Logout</button>
    </div>
  </nav>

  <div class=" container mt-4">

    <h2>Total Balance: <span id="totalBalance">$0</span></h4>
      <div class="row">
        <!-- Accounts Section -->
        <div class="col-md-6">
          <div class="my-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <h4>Your Accounts</h4>
              <button class="btn btn-primary mb-2" data-bs-toggle="modal" data-bs-target="#accountModal">+ New
                Account</button>
            </div>
            <ul id="accountList" class="list-group"></ul>
          </div>
        </div>

        <!-- Transactions Section -->
        <div class="col-md-6">
          <div class="my-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <h4>Recent Transactions</h4>
              <button class="btn btn-primary mb-2 ms-2" data-bs-toggle="modal" data-bs-target="#transactionModal">+ New
                Transaction</button>
            </div>
            <ul id="transactionList" class="list-group"></ul>
          </div>
        </div>

      </div>

      <!-- Add Account Modal -->
      <div class="modal fade" id="accountModal" tabindex="-1" aria-labelledby="accountModalLabel" aria-hidden="true">
        <div class="modal-dialog">
          <form id="accountForm" class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title" id="accountModalLabel">Create Account</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
              <input type="text" class="form-control mb-3" id="accountName" placeholder="Account Name" required>
              <input type="number" class="form-control" id="initialBalance" placeholder="Initial Balance" min="0"
                step="0.01">
            </div>
            <div class="modal-footer">
              <button type="submit" class="btn btn-secondary">Create</button>
            </div>
          </form>
        </div>
      </div>

      <!-- Add Transaction Modal -->
      <div class="modal fade" id="transactionModal" tabindex="-1" aria-labelledby="transactionModalLabel"
        aria-hidden="true">
        <div class="modal-dialog">
          <form id="transactionForm" class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title" id="transactionModalLabel">Add Transaction</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
              <select id="transactionType" class="form-select mb-3" required>
                <option value="">Select Type</option>
                <option value="EXPENSE">Expense</option>
                <option value="INCOME">Income</option>
              </select>

              <select id="transactionCategory" class="form-select mb-3" required disabled>
                <option value="">Select Category</option>
                <!-- categories filtered by type will be populated here -->
              </select>

              <select id="transactionAccount" class="form-select mb-3" required>
                <option value="">Select Account</option>
                <!-- dynamically fill accounts here -->
              </select>

              <input type="number" id="transactionAmount" class="form-control mb-3" placeholder="Amount" min="0"
                step="1" required />
              <input type="text" id="transactionDescription" class="form-control"
                placeholder="Description (optional)" />
            </div>
            <div class="modal-footer">
              <button type="submit" class="btn btn-secondary">Create</button>
            </div>
          </form>
        </div>
      </div>
      <!-- We'll add modals/forms later -->
  </div>
  <script type="module" src="js/dashboard.js"></script>
  <script type="module" src="js/account.js"></script>
  <script type="module" src="js/transaction.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
