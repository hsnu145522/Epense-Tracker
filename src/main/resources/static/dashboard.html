<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Smart Expense Tracker Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4">
        <a class="navbar-brand" href="#">Smart Expense Tracker</a>
        <a href="categories.html" class="btn btn-secondary">Manage Categories</a>
        <div class="ms-auto">
            <button id="logoutBtn" class="btn btn-outline-light">Logout</button>
        </div>
    </nav>

    <div class=" container mt-4">
        <h2>Welcome, <span id="username">User</span>!</h2>

        <!-- Accounts Section -->
        <div class="my-4">
            <h4>Your Accounts</h4>
            <button class="btn btn-secondary mb-2" data-bs-toggle="modal" data-bs-target="#accountModal">+ Add
                Account</button>
            <button class="btn btn-primary mb-2 ms-2" data-bs-toggle="modal" data-bs-target="#transactionModal">+ Add
                Transaction</button>
            <ul id="accountList" class="list-group"></ul>
        </div>

        <!-- Transactions Section -->
        <div class="my-4">
            <h4>Recent Transactions</h4>
            <ul id="transactionList" class="list-group"></ul>
        </div>

        <!-- Add Account Modal -->
        <div class="modal fade" id="accountModal" tabindex="-1" aria-labelledby="accountModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <form id="accountForm" class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="accountModalLabel">Create Account</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <input type="text" class="form-control mb-3" id="accountName" placeholder="Account Name"
                            required>
                        <input type="number" class="form-control" id="initialBalance" placeholder="Initial Balance"
                            min="0" step="0.01">
                    </div>
                    <div class="modal-footer">
                        <button type="submit" class="btn btn-secondary">Create</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Add Transaction Modal -->
        <div class="modal fade" id="transactionModal" tabindex="-1" aria-labelledby="transactionModalLabel"
            aria-hidden="true">
            <div class="modal-dialog">
                <form id="transactionForm" class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="transactionModalLabel">Add Transaction</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <select id="transactionAccount" class="form-select mb-3" required></select>
                        <select id="transactionCategory" class="form-select mb-3" required></select>
                        <input type="number" id="transactionAmount" class="form-control mb-3" placeholder="Amount"
                            required>
                        <input type="text" id="transactionDescription" class="form-control" placeholder="Description">
                    </div>
                    <div class="modal-footer">
                        <button type="submit" class="btn btn-primary">Add</button>
                    </div>
                </form>
            </div>
        </div>
        <!-- We'll add modals/forms later -->
    </div>
    <script type="module" src="js/dashboard.js"></script>
    <script type="module" src="js/account.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
